version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: timesync-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - timesync-network

  redis:
    image: redis:8-alpine
    container_name: timesync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - timesync-network
  pgadmin:
    image: dpage/pgadmin4

    container_name: timesync-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - timesync-network

volumes:
  postgres_data:
  redis_data:

networks:
  timesync-network:
    driver: bridge